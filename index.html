:root{
  --paper:#f2e8d5;
  --paper-2:#eaddbe;
  --paper-3:#e1cd9f;
  --ink:#3b2a1a;
  --ink-soft:#6b4e35;
  --muted:#8a7256;
  --line:#cbb383;
  --line-strong:#a67c3d;
  --rust:#a8431f;
  --rust-deep:#7c2f14;
  --brass:#a67c3d;
  --brass-light:#c9a35f;
  --cream-on-rust:#f5ead2;
  --whatsapp:#4b7f45;
  --danger:#9c3b2e;
  --radius:8px;
  --radius-sm:6px;
  font-family:'ElMessiri', system-ui, sans-serif;
}

*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth; -webkit-tap-highlight-color:transparent;}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto;}
  *,*::before,*::after{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; scroll-behavior:auto !important;}
}

body{
  background:var(--paper);
  color:var(--ink);
  font-family:'ElMessiri', system-ui, sans-serif;
  min-height:100vh;
  padding-bottom:78px;
  position:relative;
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(ellipse 60% 40% at 15% 8%, rgba(168,67,31,0.07), transparent 60%),
    radial-gradient(ellipse 50% 35% at 90% 15%, rgba(166,124,61,0.09), transparent 55%),
    radial-gradient(ellipse 70% 50% at 50% 100%, rgba(122,80,40,0.06), transparent 60%);
  pointer-events:none;
  z-index:0;
}
/* subtle paper grain via layered dots */
body::after{
  content:"";
  position:fixed; inset:0;
  background-image:
    radial-gradient(rgba(107,78,53,0.05) 1px, transparent 1px);
  background-size:3px 3px;
  opacity:.5;
  pointer-events:none;
  z-index:0;
  mix-blend-mode:multiply;
}

img,svg{display:block; max-width:100%;}
button{font-family:inherit; cursor:pointer;}
a{color:inherit;}

:focus-visible{
  outline:2px solid var(--rust);
  outline-offset:2px;
  border-radius:4px;
}

/* ---------- AMBIENT BACKGROUND DECOR ---------- */
.ambient-decor{
  position:fixed;
  inset:0;
  z-index:1;
  pointer-events:none;
  overflow:hidden;
}
.decor-item{
  position:absolute;
  color:var(--brass);
  opacity:.15;
}
.decor-item svg{width:100%; height:100%;}
.d-bean1{width:38px; height:38px; top:12%; right:6%; animation:floatSlow 11s ease-in-out infinite;}
.d-bean2{width:28px; height:28px; top:68%; left:8%; opacity:.13; animation:floatSlow 9s ease-in-out infinite; animation-delay:-3s;}
.d-bean3{width:22px; height:22px; top:38%; left:4%; opacity:.11; animation:floatSlow 13s ease-in-out infinite; animation-delay:-6s;}
.d-cup1{width:44px; height:44px; top:82%; right:9%; opacity:.12; animation:floatSlow 12s ease-in-out infinite; animation-delay:-4s;}
.d-steam1{width:28px; height:44px; top:22%; left:12%; opacity:.13; animation:steamRise 8s ease-in-out infinite;}
.d-steam2{width:22px; height:36px; top:55%; right:14%; opacity:.11; animation:steamRise 10s ease-in-out infinite; animation-delay:-3.5s;}

@keyframes floatSlow{
  0%{transform:translateY(0) rotate(0deg);}
  50%{transform:translateY(-16px) rotate(6deg);}
  100%{transform:translateY(0) rotate(0deg);}
}
@keyframes steamRise{
  0%{transform:translateY(4px); opacity:.05;}
  50%{transform:translateY(-10px); opacity:.16;}
  100%{transform:translateY(4px); opacity:.05;}
}

/* ---------- TOP BAR (compact) ---------- */
.topbar{
  position:sticky;
  top:0;
  z-index:40;
  background:var(--paper-2);
  border-bottom:3px double var(--brass);
  padding:10px 14px 8px;
}
.topbar-row{
  display:flex;
  align-items:center;
  gap:10px;
}
.topbar-logo{
  flex:none;
  width:46px;
  height:46px;
  border-radius:50%;
  border:2px solid var(--paper);
  outline:1.5px solid var(--brass);
  overflow:hidden;
}
.topbar-logo img{width:100%; height:100%; object-fit:contain;}
.topbar-text{flex:1; min-width:0;}
.topbar-name{
  font-family:'Rakkas', serif;
  font-weight:400;
  font-size:21px;
  color:var(--rust);
  line-height:1.2;
}
.topbar-tag{
  font-size:11px;
  color:var(--ink-soft);
  font-weight:500;
}
.icon-btn{
  flex:none;
  width:38px;
  height:38px;
  border-radius:50%;
  background:var(--paper);
  border:1.5px solid var(--brass);
  color:var(--rust);
  display:flex;
  align-items:center;
  justify-content:center;
}
.icon-btn svg{width:17px; height:17px;}

.topbar-contact{
  margin-top:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  background:var(--rust);
  border:1px solid var(--rust-deep);
  color:var(--cream-on-rust);
  font-size:12.5px;
  font-weight:600;
  padding:7px 14px;
  border-radius:var(--radius-sm);
  text-decoration:none;
  box-shadow:2px 2px 0 rgba(124,47,20,.22);
}
.topbar-contact svg{width:14px; height:14px; flex:none;}
.topbar-contact .num{direction:ltr; unicode-bidi:isolate;}
.topbar-contact-label{opacity:.85; font-weight:500;}
.topbar-contact-label::before{content:"·"; margin-inline-end:7px; opacity:.7;}

/* ---------- SEARCH (collapsible) ---------- */
.search-drop{
  position:sticky;
  top:88px;
  z-index:39;
  background:var(--paper);
  max-height:0;
  overflow:hidden;
  transition:max-height .28s ease;
  padding:0 14px;
}
.search-drop.open{
  max-height:70px;
  padding:10px 14px;
  border-bottom:2px solid var(--line);
}
.search-box{
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--paper-2);
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  padding:10px 14px;
}
.search-box svg{width:18px; height:18px; color:var(--muted); flex:none;}
.search-box input{
  flex:1;
  background:none;
  border:none;
  color:var(--ink);
  font-family:inherit;
  font-size:15px;
  outline:none;
}
.search-box input::placeholder{color:var(--muted);}
.search-clear{
  background:none; border:none; color:var(--muted); display:none;
  width:20px; height:20px; flex:none;
}
.search-clear.show{display:block;}
.search-clear svg{width:100%; height:100%;}

/* ---------- MAIN / GRID ---------- */
main{position:relative; z-index:2; padding:16px 14px 0;}
.category-section{}
.category-title{
  display:flex;
  align-items:center;
  gap:8px;
  font-family:'Rakkas', serif;
  font-weight:400;
  font-size:23px;
  color:var(--rust);
  margin-bottom:14px;
  padding-inline-start:2px;
  border-bottom:1px dashed var(--line-strong);
  padding-bottom:9px;
}
.category-title svg{width:21px; height:21px; flex:none;}

.item-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.item-card{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  gap:5px;
  background:var(--paper-2);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px 10px 14px;
  color:inherit;
  transition:border-color .2s, transform .15s, box-shadow .2s;
}
.item-card:active{transform:scale(.97);}
.item-card:hover{border-color:var(--brass); box-shadow:2px 2px 0 rgba(166,124,61,.18);}

.item-card .item-thumb{
  width:56px;
  height:56px;
  border-radius:50%;
  background:var(--paper);
  border:1.5px solid var(--brass);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--rust);
  margin-bottom:4px;
}
.item-card .item-thumb svg{width:28px; height:28px;}

.item-card-name{font-weight:700; font-size:14px; color:var(--ink);}
.item-card-price{font-weight:800; font-size:13.5px; color:var(--rust);}
.item-card-price .cur{font-size:10.5px; font-weight:600; color:var(--muted); margin-inline-start:2px;}
.item-card-desc{
  font-size:10.5px;
  color:var(--muted);
  line-height:1.4;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.empty-state{
  text-align:center;
  padding:60px 20px;
  grid-column:1 / -1;
  color:var(--muted);
}
.empty-state svg{width:60px; height:60px; margin:0 auto 14px; color:var(--line-strong);}
.empty-state p{font-size:14px;}

/* ---------- FOOTER ---------- */
footer{
  position:relative; z-index:2;
  margin-top:34px;
  padding:26px 20px 26px;
  text-align:center;
  border-top:3px double var(--brass);
  background:var(--paper-2);
}
.footer-logo{width:50px; height:50px; margin:0 auto 10px; border-radius:50%; border:2px solid var(--paper); outline:1.5px solid var(--brass);}
.footer-logo img{width:100%; height:100%; object-fit:contain; border-radius:50%;}
footer .f-name{font-family:'Rakkas', serif; font-weight:400; font-size:18px; color:var(--rust); margin-bottom:5px;}
footer .f-desc{font-size:12px; color:var(--ink-soft); max-width:300px; margin:0 auto 12px; line-height:1.7;}
footer .f-credit{font-size:10.5px; color:var(--muted); letter-spacing:.3px;}
footer .f-credit b{color:var(--ink-soft); font-weight:700;}
footer .f-date{font-size:10px; color:var(--muted); margin-top:2px; display:inline-block;}

/* ---------- BOTTOM NAVIGATION ---------- */
.bottom-nav{
  position:fixed;
  left:0; right:0; bottom:0;
  z-index:50;
  display:flex;
  background:var(--paper-2);
  border-top:2px solid var(--brass);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  box-shadow:0 -4px 12px rgba(59,42,26,.12);
}
.bn-item{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  background:none;
  border:none;
  color:var(--ink-soft);
  padding:6px 2px;
  border-radius:var(--radius-sm);
  position:relative;
}
.bn-item svg{width:19px; height:19px;}
.bn-label{font-size:9.5px; font-weight:600; white-space:nowrap;}
.bn-item.active{color:var(--rust);}
.bn-item.active .bn-label{font-weight:800;}
.bn-item.active::before{
  content:"";
  position:absolute;
  top:0; left:50%; transform:translateX(-50%);
  width:22px; height:2.5px;
  background:var(--rust);
  border-radius:2px;
}
.bn-cart{color:var(--rust);}
.bn-badge{
  position:absolute;
  top:2px;
  inset-inline-end:calc(50% - 20px);
  min-width:15px;
  height:15px;
  padding:0 3px;
  border-radius:999px;
  background:var(--rust);
  color:var(--cream-on-rust);
  font-size:9px;
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid var(--paper-2);
}

/* ---------- CART BAR (sits above bottom nav) ---------- */
.cart-bar{
  position:fixed;
  left:0; right:0;
  bottom:60px;
  z-index:46;
  background:var(--paper-2);
  border-top:2px solid var(--brass);
  border-bottom:1px solid var(--line);
  padding:10px 14px;
  display:flex;
  align-items:center;
  gap:12px;
  transform:translateY(140%);
  transition:transform .3s ease;
  box-shadow:0 -4px 10px rgba(59,42,26,.1);
}
.cart-bar.show{transform:translateY(0);}
.cart-bar-info{flex:1; min-width:0;}
.cart-bar-count{font-size:11px; color:var(--muted);}
.cart-bar-total{font-weight:800; font-size:15px; color:var(--rust);}
.cart-bar-btn{
  flex:none;
  background:var(--rust);
  color:var(--cream-on-rust);
  border:1px solid var(--rust-deep);
  border-radius:var(--radius-sm);
  padding:9px 16px;
  font-weight:800;
  font-size:12.5px;
  display:flex;
  align-items:center;
  gap:6px;
  box-shadow:2px 2px 0 rgba(124,47,20,.3);
}
.cart-bar-btn svg{width:15px; height:15px;}
/* ---------- OVERLAY / SHEET ---------- */
.overlay{
  position:fixed; inset:0; z-index:70;
  background:rgba(59,42,26,.55);
  backdrop-filter:blur(1px);
  opacity:0;
  pointer-events:none;
  transition:opacity .25s ease;
}
.overlay.show{opacity:1; pointer-events:auto;}

.sheet{
  position:fixed;
  left:0; right:0; bottom:0;
  z-index:71;
  max-height:88vh;
  overflow-y:auto;
  background:var(--paper);
  border:1px solid var(--brass);
  border-bottom:none;
  border-radius:16px 16px 0 0;
  padding:10px 18px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(100%);
  transition:transform .32s cubic-bezier(.22,.9,.32,1);
  box-shadow:0 -2px 0 var(--rust) inset;
}
.sheet.show{transform:translateY(0);}
.sheet-handle{
  width:40px; height:4px; border-radius:999px;
  background:var(--line-strong);
  margin:6px auto 14px;
}
.sheet-close{
  position:absolute;
  top:14px;
  inset-inline-end:14px;
  width:32px; height:32px;
  border-radius:50%;
  background:var(--paper-2);
  border:1px solid var(--line);
  color:var(--ink-soft);
  display:flex; align-items:center; justify-content:center;
}
.sheet-close svg{width:15px; height:15px;}

/* item detail sheet */
.detail-icon{
  width:92px; height:92px;
  border-radius:50%;
  background:var(--paper-2);
  border:2px solid var(--brass);
  display:flex; align-items:center; justify-content:center;
  color:var(--rust);
  margin:0 auto 6px;
}
.detail-icon svg{width:46px; height:46px;}
.detail-soon{
  text-align:center; font-size:11px; color:var(--muted); margin-bottom:14px;
}
.detail-name{font-family:'Rakkas', serif; font-weight:400; font-size:23px; color:var(--rust); text-align:center; margin-bottom:6px;}
.detail-desc{font-size:13.5px; color:var(--ink-soft); text-align:center; line-height:1.7; margin-bottom:4px;}
.detail-draft-note{font-size:10.5px; color:var(--brass); text-align:center; margin-bottom:14px;}
.detail-price{
  text-align:center; font-weight:800; font-size:22px; color:var(--rust); margin-bottom:14px;
}

.price-options{
  display:none;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-bottom:16px;
  flex-wrap:wrap;
}
.price-options.show{display:flex;}
.price-opt{
  background:var(--paper-2);
  border:1px solid var(--line-strong);
  color:var(--ink);
  border-radius:var(--radius-sm);
  padding:9px 18px;
  font-weight:700;
  font-size:14px;
  display:flex;
  align-items:center;
  gap:4px;
}
.price-opt .n{direction:ltr; unicode-bidi:isolate;}
.price-opt.selected{
  background:var(--rust);
  color:var(--cream-on-rust);
  border-color:var(--rust-deep);
}

.note-field{
  display:none;
  margin-bottom:16px;
}
.note-field.show{display:block;}
.note-field label{
  display:block;
  font-size:12px;
  color:var(--muted);
  margin-bottom:6px;
  text-align:center;
}
.note-field input{
  width:100%;
  background:var(--paper-2);
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  padding:11px 14px;
  color:var(--ink);
  font-family:inherit;
  font-size:13.5px;
  outline:none;
  text-align:center;
}
.note-field input::placeholder{color:var(--muted); opacity:.8;}
.note-field input:focus{border-color:var(--rust);}

.qty-row{
  display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:18px;
}
.qty-btn{
  width:38px; height:38px; border-radius:50%;
  background:var(--paper-2); border:1.5px solid var(--brass);
  color:var(--ink); font-size:18px; font-weight:800;
  display:flex; align-items:center; justify-content:center;
}
.qty-val{font-weight:800; font-size:17px; min-width:24px; text-align:center; color:var(--ink);}

.add-btn{
  width:100%;
  background:var(--rust);
  color:var(--cream-on-rust);
  border:1px solid var(--rust-deep);
  border-radius:var(--radius-sm);
  padding:14px;
  font-weight:800;
  font-size:15px;
  display:flex; align-items:center; justify-content:center; gap:8px;
  box-shadow:2px 2px 0 rgba(124,47,20,.3);
}
.add-btn svg{width:18px; height:18px;}

/* cart sheet */
.cart-title{font-family:'Rakkas', serif; font-weight:400; font-size:20px; color:var(--rust); margin-bottom:14px; padding-inline-end:36px;}
.cart-items{display:flex; flex-direction:column; gap:12px; margin-bottom:16px;}
.cart-item{
  display:flex; align-items:center; gap:10px;
  background:var(--paper-2);
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  padding:10px;
}
.cart-item-thumb{
  width:36px; height:36px; border-radius:50%; flex:none;
  background:var(--paper); border:1.5px solid var(--brass);
  display:flex; align-items:center; justify-content:center; color:var(--rust);
}
.cart-item-thumb svg{width:18px; height:18px;}
.cart-item-info{flex:1; min-width:0;}
.cart-item-name{font-weight:700; font-size:13.5px; color:var(--ink);}
.cart-item-price{font-size:11.5px; color:var(--muted);}
.cart-item-note{font-size:10.5px; color:var(--rust); margin-top:2px; line-height:1.4;}
.cart-item-ctrl{display:flex; align-items:center; gap:8px; flex:none;}
.cart-item-ctrl button{
  width:26px; height:26px; border-radius:50%;
  background:var(--paper); border:1px solid var(--line-strong); color:var(--ink);
  font-weight:800; font-size:14px;
  display:flex; align-items:center; justify-content:center;
}
.cart-item-ctrl .cnt{font-weight:700; font-size:13px; min-width:16px; text-align:center; color:var(--ink);}
.cart-item-remove{
  width:26px; height:26px; border-radius:50%; flex:none;
  background:transparent; border:1px solid var(--line); color:var(--danger);
  display:flex; align-items:center; justify-content:center;
}
.cart-item-remove svg{width:13px; height:13px;}

.cart-summary{
  border-top:1px dashed var(--line-strong);
  padding-top:12px;
  margin-bottom:14px;
}
.cart-summary-row{display:flex; justify-content:space-between; font-size:13px; color:var(--ink-soft); margin-bottom:6px;}
.cart-summary-row.total{font-size:17px; font-weight:800; color:var(--rust);}
.cart-approx-note{font-size:10.5px; color:var(--brass); margin-bottom:10px; line-height:1.6;}

.checkout-btn{
  width:100%;
  background:var(--whatsapp);
  color:#fff;
  border:1px solid #3a6636;
  border-radius:var(--radius-sm);
  padding:14px;
  font-weight:800;
  font-size:15px;
  display:flex; align-items:center; justify-content:center; gap:8px;
  margin-bottom:8px;
  box-shadow:2px 2px 0 rgba(59,42,26,.2);
}
.checkout-btn svg{width:18px; height:18px;}
.cart-empty{
  text-align:center; padding:40px 10px 20px; color:var(--muted); font-size:13.5px;
}
.cart-empty svg{width:50px; height:50px; margin:0 auto 12px; color:var(--line-strong);}

/* ---------- TUTORIAL MODAL ---------- */
.tut-overlay{
  position:fixed; inset:0; z-index:90;
  background:rgba(59,42,26,.6);
  display:flex; align-items:center; justify-content:center;
  padding:20px;
  opacity:0; pointer-events:none;
  transition:opacity .3s ease;
}
.tut-overlay.show{opacity:1; pointer-events:auto;}
.tut-card{
  width:100%; max-width:360px;
  background:var(--paper);
  border:1px solid var(--brass);
  border-radius:12px;
  padding:22px 20px 20px;
  text-align:center;
  transform:scale(.94);
  transition:transform .3s ease;
  box-shadow:0 -2px 0 var(--rust) inset, 4px 4px 0 rgba(59,42,26,.15);
}
.tut-overlay.show .tut-card{transform:scale(1);}
.tut-skip{
  display:block; margin-inline-start:auto; margin-bottom:10px;
  background:none; border:none; color:var(--muted); font-size:12px; font-weight:700;
}
.tut-illust{
  width:120px; height:120px; margin:0 auto 16px;
  color:var(--rust);
}
.tut-illust svg{width:100%; height:100%;}
.tut-step-title{font-family:'Rakkas', serif; font-weight:400; font-size:19px; color:var(--rust); margin-bottom:8px;}
.tut-step-desc{font-size:13px; color:var(--ink-soft); line-height:1.7; margin-bottom:20px;}
.tut-dots{display:flex; align-items:center; justify-content:center; gap:6px; margin-bottom:18px;}
.tut-dot{width:6px; height:6px; border-radius:50%; background:var(--line-strong); transition:background .2s, width .2s;}
.tut-dot.active{background:var(--rust); width:18px; border-radius:999px;}
.tut-next{
  width:100%;
  background:var(--rust);
  color:var(--cream-on-rust); border:1px solid var(--rust-deep); border-radius:var(--radius-sm);
  padding:13px; font-weight:800; font-size:14.5px;
  box-shadow:2px 2px 0 rgba(124,47,20,.3);
}

/* toast */
.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
  z-index:95;
  background:var(--ink);
  border:1px solid var(--brass);
  color:var(--paper);
  padding:10px 18px;
  border-radius:var(--radius-sm);
  font-size:13px;
  font-weight:700;
  opacity:0;
  pointer-events:none;
  transition:opacity .25s ease, transform .25s ease;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

@media (min-width:480px){
  .item-grid{grid-template-columns:1fr 1fr 1fr;}
}

<body>

const WHATSAPP_NUMBER = "963982562512";

/* ============ HELPERS ============ */
function formatPrice(price){
  if(Array.isArray(price)){
    return '<span dir="ltr">'+price[0]+'-'+price[1]+'</span><span class="cur"> ل.س</span>';
  }
  return '<span dir="ltr">'+price+'</span><span class="cur"> ل.س</span>';
}
function isRange(price){ return Array.isArray(price); }

function normalizeArabic(str){
  return (str||"")
    .toString()
    .replace(/[\u064B-\u0652\u0670\u0640]/g,"") // tashkeel + tatweel
    .replace(/[أإآا]/g,"ا")
    .replace(/ة/g,"ه")
    .replace(/ى/g,"ي")
    .replace(/ؤ/g,"و")
    .replace(/ئ/g,"ي")
    .toLowerCase()
    .trim();
}

function waLink(number, text){
  return "https://wa.me/"+number+(text ? ("?text="+encodeURIComponent(text)) : "");
}

/* ============ STATE ============ */
let cartLines = []; // { lineId, uid, price, qty, note }
let lineIdCounter = 0;
let activeDetailUid = null;
let detailQty = 1;
let detailSelectedPrice = null;

/* ============ RENDER MENU ============ */
const mainEl = document.getElementById("main");
const bottomNavEl = document.getElementById("bottomNav");
let activeCategory = MENU[0].id;

function findItem(uid){
  for(const cat of MENU){
    for(const it of cat.items){
      if(it.uid === uid) return it;
    }
  }
  return null;
}

function renderBottomNav(){
  let html = MENU.map(cat => (
    '<button class="bn-item'+(cat.id===activeCategory?' active':'')+'" data-cat="'+cat.id+'">'+
      ICONS[cat.icon]+'<span class="bn-label">'+cat.name+'</span>'+
    '</button>'
  )).join("");
  html += (
    '<button class="bn-item bn-cart" id="bnCart">'+
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.2 11.4a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L20.5 8H6"/><circle cx="10" cy="20" r="1.4" fill="currentColor" stroke="none"/><circle cx="17" cy="20" r="1.4" fill="currentColor" stroke="none"/></svg>'+
      '<span class="bn-badge" id="cartBadge">0</span>'+
      '<span class="bn-label">السلة</span>'+
    '</button>'
  );
  bottomNavEl.innerHTML = html;
  bottomNavEl.querySelectorAll(".bn-item[data-cat]").forEach(btn=>{
    btn.addEventListener("click", ()=>switchCategory(btn.dataset.cat));
  });
  document.getElementById("bnCart").addEventListener("click", ()=>openSheet(cartSheet));
}

function setActiveNav(catId){
  bottomNavEl.querySelectorAll(".bn-item[data-cat]").forEach(b=>{
    b.classList.toggle("active", b.dataset.cat===catId);
  });
}

function itemCardHTML(it){
  return (
    '<button class="item-card" data-uid="'+it.uid+'">'+
      '<span class="item-thumb">'+ICONS[MENU.find(c=>c.id===it.catId).icon]+'</span>'+
      '<span class="item-card-name">'+it.name+'</span>'+
      '<span class="item-card-price">'+formatPrice(it.price)+'</span>'+
      '<span class="item-card-desc">'+it.desc+'</span>'+
    '</button>'
  );
}

function renderMenu(){
  const cat = MENU.find(c=>c.id===activeCategory);
  mainEl.innerHTML = (
    '<section class="category-section" id="sec-'+cat.id+'">'+
      '<h2 class="category-title">'+ICONS[cat.icon]+'<span>'+cat.name+'</span></h2>'+
      '<div class="item-grid">'+cat.items.map(itemCardHTML).join("")+'</div>'+
    '</section>'
  );
}

function switchCategory(catId){
  activeCategory = catId;
  isSearching = false;
  searchInput.value = "";
  searchClear.classList.remove("show");
  closeSearchDrop();
  setActiveNav(catId);
  renderMenu();
  window.scrollTo({top:0, behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? "auto" : "smooth"});
}

function renderSearchResults(query){
  const nq = normalizeArabic(query);
  const results = [];
  MENU.forEach(cat => cat.items.forEach(it => {
    if(normalizeArabic(it.name).includes(nq) || normalizeArabic(it.desc).includes(nq)){
      results.push(it);
    }
  }));
  if(results.length === 0){
    mainEl.innerHTML = (
      '<div class="item-grid">'+
      '<div class="empty-state">'+
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>'+
        '<p>ما في نتائج مطابقة، جرّب كلمة تانية</p>'+
      '</div>'+
      '</div>'
    );
    return;
  }
  mainEl.innerHTML = (
    '<section class="category-section">'+
      '<div class="item-grid">'+results.map(itemCardHTML).join("")+'</div>'+
    '</section>'
  );
}

/* ============ DETAIL SHEET ============ */
const overlay = document.getElementById("overlay");
const detailSheet = document.getElementById("detailSheet");
const cartSheet = document.getElementById("cartSheet");

function openSheet(sheet){
  overlay.classList.add("show");
  sheet.classList.add("show");
  document.body.style.overflow = "hidden";
}
function closeSheets(){
  overlay.classList.remove("show");
  detailSheet.classList.remove("show");
  cartSheet.classList.remove("show");
  document.body.style.overflow = "";
}
overlay.addEventListener("click", closeSheets);
document.getElementById("detailClose").addEventListener("click", closeSheets);
document.getElementById("cartClose").addEventListener("click", closeSheets);

function renderDetailPrice(it){
  const priceEl = document.getElementById("detailPrice");
  const optsEl = document.getElementById("priceOptions");
  if(isRange(it.price)){
    priceEl.innerHTML = '<span dir="ltr">'+detailSelectedPrice+'</span><span class="cur"> ل.س</span>';
    optsEl.classList.add("show");
    optsEl.innerHTML = it.price.map(p =>
      '<button class="price-opt'+(p===detailSelectedPrice?' selected':'')+'" data-price="'+p+'"><span class="n">'+p+'</span><span>ل.س</span></button>'
    ).join("");
    optsEl.querySelectorAll(".price-opt").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        detailSelectedPrice = Number(btn.dataset.price);
        renderDetailPrice(it);
      });
    });
  } else {
    priceEl.innerHTML = formatPrice(it.price);
    optsEl.classList.remove("show");
    optsEl.innerHTML = "";
  }
}

function openDetail(uid){
  const it = findItem(uid);
  if(!it) return;
  activeDetailUid = uid;
  detailQty = 1;
  detailSelectedPrice = isRange(it.price) ? it.price[0] : it.price;
  document.getElementById("detailIcon").innerHTML = ICONS[MENU.find(c=>c.id===it.catId).icon];
  document.getElementById("detailName").textContent = it.name;
  document.getElementById("detailDesc").textContent = it.desc;
  renderDetailPrice(it);
  document.getElementById("qtyVal").textContent = "1";
  const noteField = document.getElementById("noteField");
  const noteInput = document.getElementById("noteInput");
  noteInput.value = "";
  if(it.catId === "mojito"){
    noteField.classList.add("show");
  } else {
    noteField.classList.remove("show");
  }
  openSheet(detailSheet);
}

document.getElementById("qtyMinus").addEventListener("click", ()=>{
  detailQty = Math.max(1, detailQty-1);
  document.getElementById("qtyVal").textContent = detailQty;
});
document.getElementById("qtyPlus").addEventListener("click", ()=>{
  detailQty = Math.min(20, detailQty+1);
  document.getElementById("qtyVal").textContent = detailQty;
});
document.getElementById("addToCartBtn").addEventListener("click", ()=>{
  if(!activeDetailUid) return;
  const it = findItem(activeDetailUid);
  const finalPrice = isRange(it.price) ? detailSelectedPrice : it.price;
  const note = document.getElementById("noteInput").value.trim();

  // merge into an existing identical line (same item, price, note) if present
  const existing = cartLines.find(l => l.uid===activeDetailUid && l.price===finalPrice && l.note===note);
  if(existing){
    existing.qty += detailQty;
  } else {
    cartLines.push({ lineId:"ln"+(lineIdCounter++), uid:activeDetailUid, price:finalPrice, qty:detailQty, note:note });
  }
  updateCartUI();
  showToast("تمت الإضافة للسلة");
  closeSheets();
});

/* ============ CART ============ */
const cartBar = document.getElementById("cartBar");
const cartBarCount = document.getElementById("cartBarCount");
const cartBarTotal = document.getElementById("cartBarTotal");
const cartBody = document.getElementById("cartBody");

function cartCount(){
  return cartLines.reduce((a,l)=>a+l.qty,0);
}
function cartTotal(){
  return cartLines.reduce((sum,l)=>sum + l.price*l.qty, 0);
}

function updateCartUI(){
  const count = cartCount();
  const cartBadge = document.getElementById("cartBadge");
  if(cartBadge) cartBadge.textContent = count;
  if(count > 0){
    cartBar.classList.add("show");
  } else {
    cartBar.classList.remove("show");
  }
  cartBarCount.textContent = count + (count===1 ? " صنف" : " أصناف");
  cartBarTotal.innerHTML = formatPrice(cartTotal());
  renderCartSheet();
}

function renderCartSheet(){
  if(cartLines.length === 0){
    cartBody.innerHTML = (
      '<div class="cart-empty">'+
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.2 11.4a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L20.5 8H6"/></svg>'+
        '<p>السلة فاضية لهلق، ضيف أصناف من المنيو</p>'+
      '</div>'
    );
    return;
  }
  let html = '<div class="cart-items">';
  cartLines.forEach(line=>{
    const it = findItem(line.uid);
    html += (
      '<div class="cart-item">'+
        '<span class="cart-item-thumb">'+ICONS[MENU.find(c=>c.id===it.catId).icon]+'</span>'+
        '<span class="cart-item-info">'+
          '<div class="cart-item-name">'+it.name+'</div>'+
          '<div class="cart-item-price">'+formatPrice(line.price)+'</div>'+
          (line.note ? '<div class="cart-item-note">ملاحظة: '+line.note+'</div>' : '')+
        '</span>'+
        '<span class="cart-item-ctrl">'+
          '<button data-act="dec" data-line="'+line.lineId+'">−</button>'+
          '<span class="cnt">'+line.qty+'</span>'+
          '<button data-act="inc" data-line="'+line.lineId+'">+</button>'+
        '</span>'+
        '<button class="cart-item-remove" data-act="rm" data-line="'+line.lineId+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>'+
      '</div>'
    );
  });
  html += '</div>';
  html += (
    '<div class="cart-summary">'+
      '<div class="cart-summary-row"><span>عدد الأصناف</span><span>'+cartCount()+'</span></div>'+
      '<div class="cart-summary-row total"><span>المجموع</span><span>'+formatPrice(cartTotal())+'</span></div>'+
    '</div>'
  );
  html += (
    '<a class="checkout-btn" id="checkoutBtn" href="#" target="_blank" rel="noopener">'+
      '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.5 2 2 6.4 2 12c0 1.9.5 3.6 1.4 5.1L2 22l5.1-1.3A10 10 0 0 0 12 22c5.5 0 10-4.4 10-10S17.5 2 12 2Zm5.9 14.2c-.2.7-1.4 1.3-2 1.4-.5.1-1.2.1-1.9-.1-.4-.1-1-.3-1.7-.6-3-1.3-4.9-4.3-5-4.5-.1-.2-1.2-1.6-1.2-3.1s.8-2.2 1.1-2.5c.3-.3.6-.4.8-.4h.6c.2 0 .4 0 .6.5.2.5.8 1.9.9 2 .1.2.1.4 0 .6-.1.2-.1.3-.3.5l-.4.5c-.1.2-.3.3-.1.6.2.3.9 1.5 2 2.4 1.4 1.2 2.5 1.6 2.9 1.8.3.1.5.1.7-.1l.7-.8c.2-.3.5-.2.8-.1l1.7.8c.3.1.5.2.6.4.1.2.1.9-.1 1.6Z"/></svg>'+
      'إتمام الطلب عبر واتساب'+
    '</a>'
  );
  cartBody.innerHTML = html;

  document.getElementById("checkoutBtn").href = buildCheckoutLink();

  cartBody.querySelectorAll('[data-act]').forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const lineId = btn.dataset.line;
      const act = btn.dataset.act;
      const line = cartLines.find(l=>l.lineId===lineId);
      if(!line) return;
      if(act==="inc") line.qty += 1;
      if(act==="dec") line.qty -= 1;
      if(act==="rm" || line.qty<=0) cartLines = cartLines.filter(l=>l.lineId!==lineId);
      updateCartUI();
    });
  });
}

function buildCheckoutLink(){
  let lines = ["مرحباً، بدي أطلب من كافي العراب:", ""];
  cartLines.forEach(line=>{
    const it = findItem(line.uid);
    let entry = "- "+it.name+" × "+line.qty+"  ("+line.price+" ل.س)";
    if(line.note){
      entry += "\n  ملاحظة/النكهة: "+line.note;
    }
    lines.push(entry);
  });
  lines.push("");
  lines.push("المجموع: "+cartTotal()+" ل.س");
  return waLink(WHATSAPP_NUMBER, lines.join("\n"));
}

document.getElementById("cartBarBtn").addEventListener("click", ()=>openSheet(cartSheet));

let toastTimer;
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;

/* ============ SEARCH WIRING (collapsible) ============ */
let isSearching = false;
const searchInput = document.getElementById("searchInput");
const searchClear = document.getElementById("searchClear");
const searchDrop = document.getElementById("searchDrop");
const searchToggle = document.getElementById("searchToggle");

function closeSearchDrop(){
  searchDrop.classList.remove("open");
}
function openSearchDrop(){
  searchDrop.classList.add("open");
  setTimeout(()=>searchInput.focus(), 150);
}

searchToggle.addEventListener("click", ()=>{
  const isOpen = searchDrop.classList.contains("open");
  if(isOpen){
    closeSearchDrop();
    if(searchInput.value.trim().length===0){
      isSearching = false;
      renderMenu();
    }
  } else {
    openSearchDrop();
  }
});

searchInput.addEventListener("input", ()=>{
  const q = searchInput.value.trim();
  searchClear.classList.toggle("show", q.length>0);
  if(q.length===0){
    isSearching = false;
    renderMenu();
  } else {
    isSearching = true;
    renderSearchResults(q);
  }
});
searchClear.addEventListener("click", ()=>{
  searchInput.value = "";
  searchClear.classList.remove("show");
  isSearching = false;
  renderMenu();
  searchInput.focus();
});
