:root{
  --ink:#0b0906;
  --ink-2:#141009;
  --surface:#1a140c;
  --surface-2:#221a10;
  --line:#3a2c15;
  --gold:#d9a94a;
  --gold-bright:#f3d98a;
  --gold-deep:#96631f;
  --cream:#f5ecd8;
  --muted:#b7a98c;
  --whatsapp:#3fbd58;
  --danger:#c85a4a;
  --radius:14px;
  --radius-sm:10px;
  --header-h:0px;
  font-family:'Cairo', system-ui, sans-serif;
}

*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth; -webkit-tap-highlight-color:transparent;}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto;}
  *,*::before,*::after{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; scroll-behavior:auto !important;}
}

body{
  background:var(--ink);
  color:var(--cream);
  font-family:'Cairo', system-ui, sans-serif;
  min-height:100vh;
  padding-bottom:40px;
  position:relative;
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(ellipse at 20% -10%, rgba(217,169,74,0.10), transparent 45%),
    radial-gradient(ellipse at 100% 15%, rgba(217,169,74,0.06), transparent 40%);
  pointer-events:none;
  z-index:0;
}

img,svg{display:block; max-width:100%;}
button{font-family:inherit; cursor:pointer;}
a{color:inherit;}

:focus-visible{
  outline:2px solid var(--gold-bright);
  outline-offset:2px;
  border-radius:6px;
}

/* ---------- AMBIENT BACKGROUND DECOR ---------- */
.ambient-decor{
  position:fixed;
  inset:0;
  z-index:1;
  pointer-events:none;
  overflow:hidden;
}
.decor-item{
  position:absolute;
  color:var(--gold);
  opacity:.16;
}
.decor-item svg{width:100%; height:100%;}
.d-bean1{width:38px; height:38px; top:12%; right:6%; animation:floatSlow 11s ease-in-out infinite;}
.d-bean2{width:28px; height:28px; top:68%; left:8%; opacity:.14; animation:floatSlow 9s ease-in-out infinite; animation-delay:-3s;}
.d-bean3{width:22px; height:22px; top:38%; left:4%; opacity:.12; animation:floatSlow 13s ease-in-out infinite; animation-delay:-6s;}
.d-cup1{width:44px; height:44px; top:82%; right:9%; opacity:.13; animation:floatSlow 12s ease-in-out infinite; animation-delay:-4s;}
.d-steam1{width:28px; height:44px; top:22%; left:12%; opacity:.14; animation:steamRise 8s ease-in-out infinite;}
.d-steam2{width:22px; height:36px; top:55%; right:14%; opacity:.12; animation:steamRise 10s ease-in-out infinite; animation-delay:-3.5s;}

@keyframes floatSlow{
  0%{transform:translateY(0) rotate(0deg);}
  50%{transform:translateY(-16px) rotate(6deg);}
  100%{transform:translateY(0) rotate(0deg);}
}
@keyframes steamRise{
  0%{transform:translateY(4px); opacity:.06;}
  50%{transform:translateY(-10px); opacity:.18;}
  100%{transform:translateY(4px); opacity:.06;}
}

/* ---------- HERO / HEADER ---------- */
.hero{
  position:relative;
  padding:28px 18px 18px;
  text-align:center;
  overflow:hidden;
  background:
    radial-gradient(ellipse 120% 90% at 50% -20%, #2a2011 0%, var(--ink) 65%);
  border-bottom:1px solid var(--line);
}

.hero-smoke{
  position:absolute;
  top:-40px;
  right:50%;
  transform:translateX(50%);
  width:220px;
  height:260px;
  opacity:.35;
  pointer-events:none;
  z-index:0;
}
.hero-smoke path{
  stroke:var(--gold);
  fill:none;
  stroke-width:2;
  stroke-linecap:round;
  animation:smokeDrift 7s ease-in-out infinite;
  transform-origin:center;
}
.hero-smoke path:nth-child(2){animation-delay:-2.3s;}
.hero-smoke path:nth-child(3){animation-delay:-4.6s;}
@keyframes smokeDrift{
  0%{transform:translateY(6px) scaleX(1); opacity:.15;}
  50%{transform:translateY(-14px) scaleX(1.08); opacity:.4;}
  100%{transform:translateY(6px) scaleX(1); opacity:.15;}
}

.brand-logo{
  position:relative;
  z-index:1;
  width:118px;
  height:118px;
  margin:0 auto 10px;
  border-radius:50%;
  filter:drop-shadow(0 6px 18px rgba(0,0,0,.55));
}
.brand-logo img{width:100%; height:100%; object-fit:contain;}

.brand-name{
  position:relative; z-index:1;
  font-weight:900;
  font-size:clamp(26px, 7vw, 34px);
  letter-spacing:.5px;
  background:linear-gradient(180deg, var(--gold-bright), var(--gold) 55%, var(--gold-deep));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  margin-bottom:4px;
}
.brand-tag{
  position:relative; z-index:1;
  font-weight:400;
  font-size:13.5px;
  color:var(--muted);
  margin-bottom:14px;
}

.contact-row{
  position:relative; z-index:1;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
}
.contact-pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:var(--surface);
  border:1px solid var(--line);
  color:var(--cream);
  font-size:13px;
  font-weight:600;
  padding:7px 12px;
  border-radius:999px;
  text-decoration:none;
}
.contact-pill svg{width:15px; height:15px; flex:none;}
.contact-pill .num{direction:ltr; unicode-bidi:isolate;}

/* ---------- SEARCH ---------- */
.search-wrap{
  position:sticky;
  top:0;
  z-index:30;
  background:var(--ink);
  padding:10px 14px 0;
}
.search-box{
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:999px;
  padding:10px 14px;
}
.search-box svg{width:18px; height:18px; color:var(--muted); flex:none;}
.search-box input{
  flex:1;
  background:none;
  border:none;
  color:var(--cream);
  font-family:inherit;
  font-size:15px;
  outline:none;
}
.search-box input::placeholder{color:var(--muted);}
.search-clear{
  background:none; border:none; color:var(--muted); display:none;
  width:20px; height:20px; flex:none;
}
.search-clear.show{display:block;}
.search-clear svg{width:100%; height:100%;}

/* ---------- CATEGORY TABS ---------- */
.tabs-wrap{
  position:sticky;
  top:60px;
  z-index:29;
  background:var(--ink);
  padding:10px 0 10px;
  border-bottom:1px solid var(--line);
}
.tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:0 14px;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  flex:none;
  display:flex;
  align-items:center;
  gap:6px;
  background:var(--surface);
  border:1px solid var(--line);
  color:var(--muted);
  font-weight:700;
  font-size:13.5px;
  padding:9px 16px;
  border-radius:999px;
  white-space:nowrap;
  transition:background .2s, color .2s, border-color .2s;
}
.tab svg{width:16px; height:16px;}
.tab.active{
  background:linear-gradient(180deg, var(--gold-bright), var(--gold));
  color:#20160a;
  border-color:transparent;
}

/* ---------- MAIN / SECTIONS ---------- */
main{position:relative; z-index:1; padding:6px 14px 0;}
.category-section{padding-top:20px; scroll-margin-top:var(--scroll-offset, 118px);}
.category-title{
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:800;
  font-size:19px;
  color:var(--gold-bright);
  margin-bottom:10px;
  padding-inline-start:2px;
}
.category-title svg{width:20px; height:20px; flex:none;}

.item-list{display:flex; flex-direction:column; gap:10px;}

.item-row{
  display:flex;
  align-items:center;
  gap:12px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:10px;
  text-align:start;
  width:100%;
  color:inherit;
  transition:border-color .2s, transform .15s;
}
.item-row:active{transform:scale(.98);}
.item-row:hover{border-color:var(--gold-deep);}

.item-thumb{
  flex:none;
  width:52px;
  height:52px;
  border-radius:50%;
  background:var(--surface-2);
  border:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--gold);
}
.item-thumb svg{width:26px; height:26px;}

.item-info{flex:1; min-width:0;}
.item-name{font-weight:700; font-size:15px; margin-bottom:2px;}
.item-desc{font-size:12.5px; color:var(--muted); line-height:1.4;}

.item-price{
  flex:none;
  font-weight:800;
  font-size:14.5px;
  color:var(--gold-bright);
  text-align:end;
  white-space:nowrap;
}
.item-price .cur{font-size:11px; font-weight:600; color:var(--muted); margin-inline-start:2px;}

.item-chevron{flex:none; width:16px; height:16px; color:var(--muted); transform:rotate(180deg);}

.empty-state{
  text-align:center;
  padding:60px 20px;
  color:var(--muted);
}
.empty-state svg{width:60px; height:60px; margin:0 auto 14px; color:var(--line);}
.empty-state p{font-size:14px;}

/* ---------- FOOTER ---------- */
footer{
  position:relative; z-index:1;
  margin-top:40px;
  padding:26px 20px 30px;
  text-align:center;
  border-top:1px solid var(--line);
}
.footer-logo{width:56px; height:56px; margin:0 auto 10px; border-radius:50%;}
.footer-logo img{width:100%; height:100%; object-fit:contain;}
footer .f-name{font-weight:800; font-size:16px; color:var(--gold-bright); margin-bottom:4px;}
footer .f-desc{font-size:12.5px; color:var(--muted); max-width:320px; margin:0 auto 14px; line-height:1.6;}
footer .f-credit{font-size:11px; color:var(--line); letter-spacing:.3px;}
footer .f-credit b{color:var(--muted); font-weight:700;}
footer .f-date{font-size:10.5px; color:var(--line); margin-top:2px; direction:ltr; display:inline-block;}

/* ---------- FLOATING CART BUTTON ---------- */
.cart-fab{
  position:fixed;
  top:16px;
  left:14px;
  z-index:50;
  width:46px;
  height:46px;
  border-radius:50%;
  background:var(--surface);
  border:1px solid var(--line);
  color:var(--gold-bright);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 6px 16px rgba(0,0,0,.4);
}
.cart-fab svg{width:22px; height:22px;}
.cart-fab .badge{
  position:absolute;
  top:-4px;
  inset-inline-end:-4px;
  min-width:18px;
  height:18px;
  padding:0 4px;
  border-radius:999px;
  background:var(--gold);
  color:#20160a;
  font-size:10.5px;
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ---------- WHATSAPP CONTACT FAB ---------- */
.wa-fab{
  position:fixed;
  bottom:18px;
  inset-inline-end:16px;
  z-index:45;
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--whatsapp);
  color:#fff;
  border:none;
  border-radius:999px;
  padding:12px 16px;
  font-weight:700;
  font-size:13px;
  box-shadow:0 8px 20px rgba(0,0,0,.45);
  transition:bottom .25s ease;
}
.wa-fab svg{width:19px; height:19px;}

/* ---------- CART BAR (bottom) ---------- */
.cart-bar{
  position:fixed;
  left:0; right:0; bottom:0;
  z-index:46;
  background:linear-gradient(180deg, var(--surface-2), var(--ink-2));
  border-top:1px solid var(--gold-deep);
  padding:12px 14px calc(12px + env(safe-area-inset-bottom));
  display:flex;
  align-items:center;
  gap:12px;
  transform:translateY(110%);
  transition:transform .3s ease;
  box-shadow:0 -8px 22px rgba(0,0,0,.5);
}
.cart-bar.show{transform:translateY(0);}
.cart-bar-info{flex:1; min-width:0;}
.cart-bar-count{font-size:11.5px; color:var(--muted);}
.cart-bar-total{font-weight:800; font-size:16px; color:var(--gold-bright);}
.cart-bar-btn{
  flex:none;
  background:linear-gradient(180deg, var(--gold-bright), var(--gold));
  color:#20160a;
  border:none;
  border-radius:999px;
  padding:11px 20px;
  font-weight:800;
  font-size:13.5px;
  display:flex;
  align-items:center;
  gap:6px;
}
.cart-bar-btn svg{width:16px; height:16px;}

/* ---------- OVERLAY / SHEET ---------- */
.overlay{
  position:fixed; inset:0; z-index:70;
  background:rgba(6,4,2,.72);
  backdrop-filter:blur(2px);
  opacity:0;
  pointer-events:none;
  transition:opacity .25s ease;
}
.overlay.show{opacity:1; pointer-events:auto;}

.sheet{
  position:fixed;
  left:0; right:0; bottom:0;
  z-index:71;
  max-height:88vh;
  overflow-y:auto;
  background:var(--surface);
  border:1px solid var(--line);
  border-bottom:none;
  border-radius:22px 22px 0 0;
  padding:10px 18px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(100%);
  transition:transform .32s cubic-bezier(.22,.9,.32,1);
}
.sheet.show{transform:translateY(0);}
.sheet-handle{
  width:40px; height:4px; border-radius:999px;
  background:var(--line);
  margin:6px auto 14px;
}
.sheet-close{
  position:absolute;
  top:14px;
  inset-inline-end:14px;
  width:32px; height:32px;
  border-radius:50%;
  background:var(--surface-2);
  border:1px solid var(--line);
  color:var(--muted);
  display:flex; align-items:center; justify-content:center;
}
.sheet-close svg{width:15px; height:15px;}

/* item detail sheet */
.detail-icon{
  width:96px; height:96px;
  border-radius:50%;
  background:var(--surface-2);
  border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center;
  color:var(--gold);
  margin:0 auto 6px;
}
.detail-icon svg{width:48px; height:48px;}
.detail-soon{
  text-align:center; font-size:11px; color:var(--muted); margin-bottom:14px;
}
.detail-name{font-weight:800; font-size:20px; text-align:center; margin-bottom:6px;}
.detail-desc{font-size:13.5px; color:var(--muted); text-align:center; line-height:1.7; margin-bottom:4px;}
.detail-draft-note{font-size:10.5px; color:var(--gold-deep); text-align:center; margin-bottom:14px;}
.detail-price{
  text-align:center; font-weight:800; font-size:22px; color:var(--gold-bright); margin-bottom:18px;
}

.price-options{
  display:none;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-bottom:16px;
  flex-wrap:wrap;
}
.price-options.show{display:flex;}
.price-opt{
  background:var(--surface-2);
  border:1px solid var(--line);
  color:var(--cream);
  border-radius:999px;
  padding:9px 18px;
  font-weight:700;
  font-size:14px;
  display:flex;
  align-items:center;
  gap:4px;
}
.price-opt .n{direction:ltr; unicode-bidi:isolate;}
.price-opt.selected{
  background:linear-gradient(180deg, var(--gold-bright), var(--gold));
  color:#20160a;
  border-color:transparent;
}

.note-field{
  display:none;
  margin-bottom:16px;
}
.note-field.show{display:block;}
.note-field label{
  display:block;
  font-size:12px;
  color:var(--muted);
  margin-bottom:6px;
  text-align:center;
}
.note-field input{
  width:100%;
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  padding:11px 14px;
  color:var(--cream);
  font-family:inherit;
  font-size:13.5px;
  outline:none;
  text-align:center;
}
.note-field input::placeholder{color:var(--muted); opacity:.7;}
.note-field input:focus{border-color:var(--gold-deep);}

.qty-row{
  display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:18px;
}
.qty-btn{
  width:38px; height:38px; border-radius:50%;
  background:var(--surface-2); border:1px solid var(--line);
  color:var(--cream); font-size:18px; font-weight:800;
  display:flex; align-items:center; justify-content:center;
}
.qty-val{font-weight:800; font-size:17px; min-width:24px; text-align:center;}

.add-btn{
  width:100%;
  background:linear-gradient(180deg, var(--gold-bright), var(--gold));
  color:#20160a;
  border:none;
  border-radius:999px;
  padding:14px;
  font-weight:800;
  font-size:15px;
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.add-btn svg{width:18px; height:18px;}

/* cart sheet */
.cart-title{font-weight:800; font-size:18px; margin-bottom:14px; padding-inline-end:36px;}
.cart-items{display:flex; flex-direction:column; gap:12px; margin-bottom:16px;}
.cart-item{
  display:flex; align-items:center; gap:10px;
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  padding:10px;
}
.cart-item-thumb{
  width:38px; height:38px; border-radius:50%; flex:none;
  background:var(--ink-2); border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; color:var(--gold);
}
.cart-item-thumb svg{width:19px; height:19px;}
.cart-item-info{flex:1; min-width:0;}
.cart-item-name{font-weight:700; font-size:13.5px;}
.cart-item-price{font-size:11.5px; color:var(--muted);}
.cart-item-note{font-size:10.5px; color:var(--gold); margin-top:2px; line-height:1.4;}
.cart-item-ctrl{display:flex; align-items:center; gap:8px; flex:none;}
.cart-item-ctrl button{
  width:26px; height:26px; border-radius:50%;
  background:var(--ink-2); border:1px solid var(--line); color:var(--cream);
  font-weight:800; font-size:14px;
  display:flex; align-items:center; justify-content:center;
}
.cart-item-ctrl .cnt{font-weight:700; font-size:13px; min-width:16px; text-align:center;}
.cart-item-remove{
  width:26px; height:26px; border-radius:50%; flex:none;
  background:transparent; border:1px solid var(--line); color:var(--danger);
  display:flex; align-items:center; justify-content:center;
}
.cart-item-remove svg{width:13px; height:13px;}

.cart-summary{
  border-top:1px dashed var(--line);
  padding-top:12px;
  margin-bottom:14px;
}
.cart-summary-row{display:flex; justify-content:space-between; font-size:13px; color:var(--muted); margin-bottom:6px;}
.cart-summary-row.total{font-size:17px; font-weight:800; color:var(--gold-bright);}
.cart-approx-note{font-size:10.5px; color:var(--gold-deep); margin-bottom:10px; line-height:1.6;}

.checkout-btn{
  width:100%;
  background:var(--whatsapp);
  color:#fff;
  border:none;
  border-radius:999px;
  padding:14px;
  font-weight:800;
  font-size:15px;
  display:flex; align-items:center; justify-content:center; gap:8px;
  margin-bottom:8px;
}
.checkout-btn svg{width:18px; height:18px;}
.cart-empty{
  text-align:center; padding:40px 10px 20px; color:var(--muted); font-size:13.5px;
}
.cart-empty svg{width:50px; height:50px; margin:0 auto 12px; color:var(--line);}

/* ---------- TUTORIAL MODAL ---------- */
.tut-overlay{
  position:fixed; inset:0; z-index:90;
  background:rgba(6,4,2,.82);
  display:flex; align-items:center; justify-content:center;
  padding:20px;
  opacity:0; pointer-events:none;
  transition:opacity .3s ease;
}
.tut-overlay.show{opacity:1; pointer-events:auto;}
.tut-card{
  width:100%; max-width:360px;
  background:var(--surface);
  border:1px solid var(--gold-deep);
  border-radius:20px;
  padding:22px 20px 20px;
  text-align:center;
  transform:scale(.94);
  transition:transform .3s ease;
}
.tut-overlay.show .tut-card{transform:scale(1);}
.tut-skip{
  display:block; margin-inline-start:auto; margin-bottom:10px;
  background:none; border:none; color:var(--muted); font-size:12px; font-weight:700;
}
.tut-illust{
  width:120px; height:120px; margin:0 auto 16px;
  color:var(--gold);
}
.tut-illust svg{width:100%; height:100%;}
.tut-step-title{font-weight:800; font-size:17px; margin-bottom:8px;}
.tut-step-desc{font-size:13px; color:var(--muted); line-height:1.7; margin-bottom:20px;}
.tut-dots{display:flex; align-items:center; justify-content:center; gap:6px; margin-bottom:18px;}
.tut-dot{width:6px; height:6px; border-radius:50%; background:var(--line); transition:background .2s, width .2s;}
.tut-dot.active{background:var(--gold); width:18px; border-radius:999px;}
.tut-next{
  width:100%;
  background:linear-gradient(180deg, var(--gold-bright), var(--gold));
  color:#20160a; border:none; border-radius:999px;
  padding:13px; font-weight:800; font-size:14.5px;
}

/* toast */
.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
  z-index:95;
  background:var(--surface-2);
  border:1px solid var(--gold-deep);
  color:var(--cream);
  padding:10px 18px;
  border-radius:999px;
  font-size:13px;
  font-weight:700;
  opacity:0;
  pointer-events:none;
  transition:opacity .25s ease, transform .25s ease;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

@media (min-width:480px){
  .hero{padding-top:34px;}
}
</style>
</head>

/* ============ HELPERS ============ */
function formatPrice(price){
  if(Array.isArray(price)){
    return '<span dir="ltr">'+price[0]+'-'+price[1]+'</span><span class="cur"> ل.س</span>';
  }
  return '<span dir="ltr">'+price+'</span><span class="cur"> ل.س</span>';
}
function isRange(price){ return Array.isArray(price); }

function normalizeArabic(str){
  return (str||"")
    .toString()
    .replace(/[\u064B-\u0652\u0670\u0640]/g,"") // tashkeel + tatweel
    .replace(/[أإآا]/g,"ا")
    .replace(/ة/g,"ه")
    .replace(/ى/g,"ي")
    .replace(/ؤ/g,"و")
    .replace(/ئ/g,"ي")
    .toLowerCase()
    .trim();
}

function waLink(number, text){
  return "https://wa.me/"+number+(text ? ("?text="+encodeURIComponent(text)) : "");
}

function renderSearchResults(query){
  const nq = normalizeArabic(query);
  const results = [];
  MENU.forEach(cat => cat.items.forEach(it => {

function renderDetailPrice(it){
  const priceEl = document.getElementById("detailPrice");
  const optsEl = document.getElementById("priceOptions");
  if(isRange(it.price)){
    priceEl.innerHTML = '<span dir="ltr">'+detailSelectedPrice+'</span><span class="cur"> ل.س</span>';
    optsEl.classList.add("show");
    optsEl.innerHTML = it.price.map(p =>
      '<button class="price-opt'+(p===detailSelectedPrice?' selected':'')+'" data-price="'+p+'"><span class="n">'+p+'</span><span>ل.س</span></button>'
    ).join("");

      });

function openDetail(uid){
  const it = findItem(uid);
  if(!it) return;
  activeDetailUid = uid;
  detailQty = 1;
  detailSelectedPrice = isRange(it.price) ? it.price[0] : it.price;
  document.getElementById("detailIcon").innerHTML = ICONS[MENU.find(c=>c.id===it.catId).icon];
  document.getElementById("detailName").textContent = it.name;
  document.getElementById("detailDesc").textContent = it.desc;
  renderDetailPrice(it);
  document.getElementById("qtyVal").textContent = "1";
  const noteField = document.getElementById("noteField");
  const noteInput = document.getElementById("noteInput");
  noteInput.value = "";
  if(it.catId === "mojito"){
    noteField.classList.add("show");
  } else {
    noteField.classList.remove("show");
  }
  openSheet(detailSheet);
}

document.getElementById("qtyMinus").addEventListener("click", ()=>{

  document.getElementById("qtyVal").textContent = detailQty;
});
document.getElementById("qtyPlus").addEventListener("click", ()=>{
  detailQty = Math.min(20, detailQty+1);
  document.getElementById("qtyVal").textContent = detailQty;
});
document.getElementById("addToCartBtn").addEventListener("click", ()=>{
  if(!activeDetailUid) return;
  const it = findItem(activeDetailUid);
  const finalPrice = isRange(it.price) ? detailSelectedPrice : it.price;
  const note = document.getElementById("noteInput").value.trim();

  // merge into an existing identical line (same item, price, note) if present
  const existing = cartLines.find(l => l.uid===activeDetailUid && l.price===finalPrice && l.note===note);
  if(existing){
    existing.qty += detailQty;
  } else {
    cartLines.push({ lineId:"ln"+(lineIdCounter++), uid:activeDetailUid, price:finalPrice, qty:detailQty, note:note });
  }
  updateCartUI();
  showToast("تمت الإضافة للسلة");

});

function cartCount(){
  return cartLines.reduce((a,l)=>a+l.qty,0);
}
function cartTotal(){
  return cartLines.reduce((sum,l)=>sum + l.price*l.qty, 0);
}

function updateCartUI(){
  const count = cartCount();
  cartBadge.textContent = count;
  if(count > 0){
    cartBar.classList.add("show");
    waFab.style.bottom = "94px";
  } else {
    cartBar.classList.remove("show");
    waFab.style.bottom = "18px";
  }
  cartBarCount.textContent = count + (count===1 ? " صنف" : " أصناف");
  cartBarTotal.innerHTML = formatPrice(cartTotal());

}

    cartBody.innerHTML = (

      '</div>'
    );
    return;
  }
  let html = '<div class="cart-items">';
  cartLines.forEach(line=>{
    const it = findItem(line.uid);
    html += (
      '<div class="cart-item">'+
        '<span class="cart-item-thumb">'+ICONS[MENU.find(c=>c.id===it.catId).icon]+'</span>'+
        '<span class="cart-item-info">'+
          '<div class="cart-item-name">'+it.name+'</div>'+
          '<div class="cart-item-price">'+formatPrice(line.price)+'</div>'+
          (line.note ? '<div class="cart-item-note">ملاحظة: '+line.note+'</div>' : '')+
        '</span>'+
        '<span class="cart-item-ctrl">'+
          '<button data-act="dec" data-line="'+line.lineId+'">−</button>'+
          '<span class="cnt">'+line.qty+'</span>'+
          '<button data-act="inc" data-line="'+line.lineId+'">+</button>'+
        '</span>'+
        '<button class="cart-item-remove" data-act="rm" data-line="'+line.lineId+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>'+
      '</div>'
    );
  });
  html += '</div>';
  html += (
    '<div class="cart-summary">'+
      '<div class="cart-summary-row"><span>عدد الأصناف</span><span>'+cartCount()+'</span></div>'+
      '<div class="cart-summary-row total"><span>المجموع</span><span>'+formatPrice(cartTotal())+'</span></div>'+
    '</div>'
  );
  html += (
    '<a class="checkout-btn" id="checkoutBtn" href="#" target="_blank" rel="noopener">'+
      '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.5 2 2 6.4 2 12c0 1.9.5 3.6 1.4 5.1L2 22l5.1-1.3A10 10 0 0 0 12 22c5.5 0 10-4.4 10-10S17.5 2 12 2Zm5.9 14.2c-.2.7-1.4 1.3-2 1.4-.5.1-1.2.1-1.9-.1-.4-.1-1-.3-1.7-.6-3-1.3-4.9-4.3-5-4.5-.1-.2-1.2-1.6-1.2-3.1s.8-2.2 1.1-2.5c.3-.3.6-.4.8-.4h.6c.2 0 .4 0 .6.5.2.5.8 1.9.9 2 .1.2.1.4 0 .6-.1.2-.1.3-.3.5l-.4.5c-.1.2-.3.3-.1.6.2.3.9 1.5 2 2.4 1.4 1.2 2.5 1.6 2.9 1.8.3.1.5.1.7-.1l.7-.8c.2-.3.5-.2.8-.1l1.7.8c.3.1.5.2.6.4.1.2.1.9-.1 1.6Z"/></svg>'+
      'إتمام الطلب عبر واتساب'+
    '</a>'
  );
  cartBody.innerHTML = html;

  document.getElementById("checkoutBtn").href = buildCheckoutLink();

  cartBody.querySelectorAll('[data-act]').forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const lineId = btn.dataset.line;
      const act = btn.dataset.act;
      const line = cartLines.find(l=>l.lineId===lineId);
      if(!line) return;
      if(act==="inc") line.qty += 1;
      if(act==="dec") line.qty -= 1;
      if(act==="rm" || line.qty<=0) cartLines = cartLines.filter(l=>l.lineId!==lineId);
      updateCartUI();
    });
  });
}

function buildCheckoutLink(){
  let lines = ["مرحباً، بدي أطلب من كافي العراب:", ""];
  cartLines.forEach(line=>{
    const it = findItem(line.uid);
    let entry = "- "+it.name+" × "+line.qty+"  ("+line.price+" ل.س)";
    if(line.note){
      entry += "\n  ملاحظة/النكهة: "+line.note;
    }
    lines.push(entry);
  });
  lines.push("");
  lines.push("المجموع: "+cartTotal()+" ل.س");
  return waLink(WHATSAPP_NUMBER, lines.join("\n"));
}

let isSearching = false;

function scrollToCategory(catId){
  const sec = document.getElementById("sec-"+catId);
  if(sec) sec.scrollIntoView({behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? "auto" : "smooth", block:"start"});
}

tabsEl.addEventListener("click",(e)=>{
  const btn = e.target.closest(".tab");
  if(!btn) return;
  setActiveTab(btn.dataset.cat);
  scrollToCategory(btn.dataset.cat);
});

function setActiveTab(catId){
  tabsEl.querySelectorAll(".tab").forEach(t=>{
    const active = t.dataset.cat === catId;
    t.classList.toggle("active", active);
    if(active) t.scrollIntoView({behavior:"smooth", inline:"center", block:"nearest"});
  });
}

let observer;
function setupScrollspy(){
  if(observer) observer.disconnect();
  const headerOffset = document.getElementById("tabsWrap").getBoundingClientRect().bottom + 10;
  observer = new IntersectionObserver((entries)=>{
    if(isSearching) return;
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        const catId = entry.target.id.replace("sec-","");
        setActiveTab(catId);
      }
    });
  }, { rootMargin: "-"+Math.round(headerOffset)+"px 0px -70% 0px", threshold:0 });
  document.querySelectorAll(".category-section").forEach(sec=>{
    if(sec.id.startsWith("sec-")) observer.observe(sec);
  });
}

function positionStickyOffsets(){
  const searchH = document.querySelector(".search-wrap").offsetHeight;
  const tabsWrapEl = document.getElementById("tabsWrap");
  tabsWrapEl.style.top = searchH + "px";
  const totalOffset = searchH + tabsWrapEl.offsetHeight + 8;
  document.documentElement.style.setProperty("--scroll-offset", totalOffset + "px");
}

searchInput.addEventListener("input", ()=>{

  searchClear.classList.toggle("show", q.length>0);
  if(q.length===0){
    isSearching = false;
    tabsWrap.style.display = "";

    isSearching = true;

  searchInput.value = "";
  searchClear.classList.remove("show");

  renderMenu();
  setupScrollspy();

});

  const months = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
  document.getElementById("footerDate").textContent = d.getDate()+" "+months[d.getMonth()]+" "+d.getFullYear();
}

renderTabs();
renderMenu();
setupWaLinks();
setupFooterDate();
updateCartUI();
positionStickyOffsets();
setupScrollspy();
maybeShowTutorial();

window.addEventListener("resize", ()=>{
  positionStickyOffsets();
  setupScrollspy();
});

document.addEventListener("keydown",(e)=>{
  if(e.key === "Escape") closeSheets();
});

})();
</script>
